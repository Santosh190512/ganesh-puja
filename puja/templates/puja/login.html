{% extends 'puja/base.html' %}

{% block title %}Login - Ganesh Puja Portal{% endblock %}
{% block page_title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card p-4">
            <h3 class="text-center mb-4"><i class="fa-solid fa-om text-warning me-2"></i>Sign In</h3>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" required placeholder="Enter username">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required placeholder="Enter password">
                </div>
                <button type="submit" class="btn btn-warning w-100 mb-3 text-dark fw-bold">Sign In</button>
                <div class="text-center">
                    <span class="text-muted">Not registered?</span> <a href="{% url 'register' %}" class="text-warning fw-bold">Create an account</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
